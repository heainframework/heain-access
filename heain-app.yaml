# heain-access v2 (Step 4d, 2026-10-06): identity verification and access grants on heain-sdk v1.
# Templates only (never images), sealed per subject under keys held by core's KMS, retention
# at most 30 days; registries and keycard ACLs come from heain-database; AI models are local
# sidecars; every AI decision has a signed reasoning record. dcp-key is an optional plugin.
# 2.2 (Stage B-3a, 2026-10-08): the keycard anomaly signal -- the ACL stays the gate; an Isolation Forest
# scores each swipe against the card's own history (advisory: a flagged swipe goes to an Approver as
# P5 access.keycard_review); swipe history sealed per card, at most 90 days.
manifest_version: 1
app:
  id: heain-access
  version: 2.2.0
  group: base
  description: Identity verification (face, fingerprint, ID card, keycard) and signed access grants.
  api: v1
  sdk: {name: heain-sdk-go, version: ">=1.0.0"}
capabilities:
  - name: identity.enroll.face
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: true, model: {name: insightface-buffalo_l, version: "0.7.3"}, reasoning_record: required}
    data_classes: [biometric_template]
  - name: identity.enroll.fingerprint
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: true, model: {name: nbis-mindtct-bozorth3, version: "5.0"}, reasoning_record: required}
    data_classes: [biometric_template]
  - {name: identity.subject.remove, version: 1, formal: true, execution: direct, lane: identity, ai: {used: false}, data_classes: [biometric_template]}
  - name: identity.verify.face
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: true, model: {name: insightface-buffalo_l, version: "0.7.3"}, reasoning_record: required}
    data_classes: [biometric_template]
  - name: identity.verify.fingerprint
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: true, model: {name: nbis-mindtct-bozorth3, version: "5.0"}, reasoning_record: required}
    data_classes: [biometric_template]
  - name: identity.verify.idcard
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: true, model: {name: easyocr-th-en, version: "1.7"}, reasoning_record: required}
  - name: identity.verify.keycard
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: true, model: {name: keycard-iforest, version: "1"}, reasoning_record: required}
    data_classes: [keycard_history]
  - {name: access.grant.issue, version: 1, formal: true, execution: direct, ai: {used: false}, data_classes: [access_grant]}
  - {name: access.grant.check, version: 1, formal: true, execution: direct, ai: {used: false}, data_classes: [access_grant]}
  - {name: access.grant.revoke, version: 1, formal: true, execution: direct, ai: {used: false}, data_classes: [access_grant]}
  - {name: access.kdm.issue, version: 1, formal: true, execution: direct, ai: {used: false}}
endpoints:
  - {method: POST, path: /v1/enroll/face, capability: identity.enroll.face, formal: true}
  - {method: POST, path: /v1/enroll/fingerprint, capability: identity.enroll.fingerprint, formal: true}
  - {method: DELETE, path: "/v1/subjects/{subject}", capability: identity.subject.remove, formal: true}
  - {method: POST, path: /v1/verify/face, capability: identity.verify.face, formal: true}
  - {method: POST, path: /v1/verify/fingerprint, capability: identity.verify.fingerprint, formal: true}
  - {method: POST, path: /v1/verify/id-card, capability: identity.verify.idcard, formal: true}
  - {method: POST, path: /v1/verify/keycard, capability: identity.verify.keycard, formal: true}
  - {method: POST, path: /v1/grants, capability: access.grant.issue, formal: true}
  - {method: GET, path: "/v1/grants/{id}", capability: access.grant.check, formal: true}
  - {method: POST, path: "/v1/grants/{id}/check", capability: access.grant.check, formal: true}
  - {method: DELETE, path: "/v1/grants/{id}", capability: access.grant.revoke, formal: true}
  - {method: POST, path: /v1/plugins/dcp-key/kdm, capability: access.kdm.issue, formal: true}
uses:
  - {app: heain-database, capabilities: [db.dataset.lookup]}
data_classes:
  - {name: biometric_template, sovereignty: node-local, retention: {max: 30d}, raw_storage: forbidden, crypto_shred: true, trust: trusted, encrypted_at_rest: true}
  - {name: access_grant, sovereignty: node-local, encrypted_at_rest: true}
  - {name: keycard_history, sovereignty: node-local, retention: {max: 90d}, crypto_shred: true, encrypted_at_rest: true}
offline:
  allowed: [identity.enroll.face, identity.enroll.fingerprint, identity.subject.remove, identity.verify.face, identity.verify.fingerprint,
            identity.verify.idcard, identity.verify.keycard, access.grant.issue, access.grant.check, access.grant.revoke]
  journal: none
plugins:
  - {name: dcp-key, kind: verifier, optional: true}
ai_sidecars:
  - {name: ocr, contract: heain-sidecar/v1, local_only: true}
  - {name: face, contract: heain-sidecar/v1, local_only: true}
  - {name: fingerprint, contract: heain-sidecar/v1, local_only: true}
